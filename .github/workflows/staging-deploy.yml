name: AuraNER Staging Continuous Deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run verification without container deployment'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality & Security Gate
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Staging Pre-Deployment Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Verification (Web + Mobile)
        run: |
          npm run typecheck
          npx tsc -p mobile/tsconfig.json --noEmit

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Vitest Comprehensive Test Suite Execution
        run: npm test

      - name: Production Next.js Build Verification
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          APP_ENV: staging
          ALLOW_MOCK_PROVIDERS: false
          JWT_SECRET: auraner_ci_staging_cryptographic_jwt_key_9381729487102938471928374
          NEXT_PUBLIC_APP_URL: https://staging.ne-routeai.in

  # ---------------------------------------------------------------------------
  # 2. Staging Database Migration & Schema Verification
  # ---------------------------------------------------------------------------
  migrate-database:
    name: Apply Staging PostGIS Schema Migrations
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Staging Migration Runner & Seed Fixtures
        run: npx tsx scripts/staging-db-migrate.ts
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || 'postgresql://staging_user:dummy@localhost:5433/ner_routeai_staging' }}

  # ---------------------------------------------------------------------------
  # 3. Containerization & Deployment
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Build Container & Deploy to Staging Slot
    needs: [quality-gate, migrate-database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.dry_run != 'true' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Staging Docker Image
        run: |
          docker build \
            --tag auraner-web:${{ github.sha }} \
            --tag auraner-web:staging-latest \
            .

      - name: Simulate Staging Slot Swap & Container Deployment
        run: |
          echo "🚀 Deploying auraner-web:${{ github.sha }} to Azure Staging Slot..."
          echo "✅ Staging Container App updated with image tag: ${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # 4. Post-Deployment Smoke Test & Health Probes
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Automated Staging Health Probes & Smoke Testing
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Staging Readiness Test Suite
        run: npx vitest run src/lib/test/staging-readiness.test.ts
        env:
          APP_ENV: staging
          JWT_SECRET: auraner_ci_staging_cryptographic_jwt_key_9381729487102938471928374
          NEXT_PUBLIC_APP_URL: https://staging.ne-routeai.in

  # ---------------------------------------------------------------------------
  # 5. Automated Rollback on Smoke Test Failure
  # ---------------------------------------------------------------------------
  rollback-on-failure:
    name: Automated Staging Rollback
    needs: [deploy-staging, smoke-test]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Trigger Automated Staging Rollback Runner
        run: npx tsx scripts/staging-rollback.ts
        env:
          APP_ENV: staging

      - name: Notify Operations Team
        run: |
          echo "🚨 STAGING DEPLOYMENT FAILED: Rollback executed to previous stable snapshot."
