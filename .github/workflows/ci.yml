name: AuraNER Continuous Integration

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  validate:
    name: Code Quality & Test Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Type Integrity
        run: npm run typecheck

      - name: Execute Vitest Test Suite (13-Step & Architecture Contracts)
        run: npm test

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          ALLOW_MOCK_PROVIDERS: true

      - name: Validate Container Build
        run: docker build -t auraner-web:ci .
